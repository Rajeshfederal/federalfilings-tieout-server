services:
  - type: web
    name: federal-filings-tieout
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 900 --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TIEOUT_PASSCODE
        sync: false
